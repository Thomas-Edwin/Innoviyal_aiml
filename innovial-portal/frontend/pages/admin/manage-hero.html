<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Manage Hero Media — Innoviyal Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/variables.css"><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/admin.css">
</head>
<body class="admin-body" data-page="hero">
<div class="admin-wrapper">
  <aside class="admin-sidebar"><div class="admin-sidebar-header"><img src="../../assets/logo/innoviyal-logo.png" alt="" class="logo" onerror="this.style.display='none'"><div><h2>Innoviyal <small>Admin Panel</small></h2></div></div>
    <nav class="admin-sidebar-nav">
      <a href="dashboard.html" class="admin-nav-item"><span class="nav-icon">📊</span>Dashboard</a>
      <a href="manage-news.html" class="admin-nav-item"><span class="nav-icon">📰</span>News</a>
      <a href="manage-events.html" class="admin-nav-item"><span class="nav-icon">📅</span>Events</a>
      <a href="manage-gallery.html" class="admin-nav-item"><span class="nav-icon">🖼️</span>Gallery</a>
      <a href="manage-hero.html" class="admin-nav-item active"><span class="nav-icon">🎬</span>Hero Media</a>
      <a href="manage-testimonials.html" class="admin-nav-item"><span class="nav-icon">💬</span>Testimonials</a>
      <a href="manage-newsletters.html" class="admin-nav-item"><span class="nav-icon">📬</span>Newsletters</a>
      <a href="manage-event-winners.html" class="admin-nav-item"><span class="nav-icon">🏅</span>Event Winners</a>
      <a href="../../index.html" class="admin-nav-item"><span class="nav-icon">🏠</span>View Site</a>
      <a href="#" class="admin-nav-item" onclick="Auth.logout()"><span class="nav-icon">🚪</span>Logout</a>
    </nav>
  </aside>
  <main class="admin-main">
    <header class="admin-header"><div class="admin-header-left"><button class="admin-menu-toggle">☰</button><h3>Hero Media Manager</h3></div></header>
    <div class="admin-content">
      <div class="admin-form" style="margin-bottom:var(--space-8);max-width:100%">
        <h3 style="margin-bottom:var(--space-4)">Add Hero Media</h3>
        <div class="file-upload-area">
          <div class="upload-icon">🎬</div>
          <h4>Upload images or short video clips</h4>
          <p>Videos: MP4, max 5 seconds, max 5MB | Images: JPG, PNG, WebP</p>
          <input type="file" accept="image/*,video/mp4" style="display:none">
        </div>
        <select style="padding:var(--space-2) var(--space-3);border:1px solid var(--gray-200);border-radius:var(--radius-md);font-size:var(--fs-sm);margin-top:var(--space-4)">
          <option value="IMAGE">Image</option><option value="VIDEO">Video</option>
        </select>
        <button class="btn btn-primary" style="margin-top:var(--space-4)">Upload</button>
      </div>
      <div class="admin-table-wrapper">
        <div class="admin-table-header"><h3>Current Hero Media</h3></div>
        <div style="padding:var(--space-6)">
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--space-4)">
            <div style="border-radius:var(--radius-lg);overflow:hidden;border:2px solid var(--gray-200);position:relative">
              <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=400&q=80" alt="" style="width:100%;height:120px;object-fit:cover">
              <div style="padding:var(--space-2);display:flex;justify-content:space-between;font-size:var(--fs-xs)">
                <span class="status-badge status-active">Active</span>
                <button class="btn-delete" style="padding:2px 8px">🗑️</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../../js/api.js"></script><script src="../../js/utils.js"></script><script src="../../js/auth.js"></script><script src="../../js/admin.js"></script>
</body>
</html>
